name: web-app-counter
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: web-app-counter-nginx
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ../application:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - web-app-counter

  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: web-app-counter-php
    volumes:
      - ../application:/var/www/html
      - composer_home:/home/www-data
      - ./php/php.ini:/etc/php/8.5/fpm/php.ini:ro
      - ./php/php-cli.ini:/etc/php/8.5/cli/php.ini:ro
      - ./php/conf.d/xdebug.ini:/etc/php/8.5/fpm/conf.d/99-xdebug.ini:ro
      - ./php/conf.d/xdebug.ini:/etc/php/8.5/cli/conf.d/99-xdebug.ini:ro
      - ./php/pool.d/zz-docker.conf:/etc/php/8.5/fpm/pool.d/zz-docker.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      PHP_IDE_CONFIG: "serverName=web-app-counter"
      HOME: /home/www-data
      COMPOSER_HOME: /home/www-data/.composer
      COMPOSER_CACHE_DIR: /home/www-data/.cache/composer
      XDG_CONFIG_HOME: /home/www-data/.config
      XDG_CACHE_HOME: /home/www-data/.cache
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-web-app-counter}
      DB_USER: ${POSTGRES_USER:-web-app-counter}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web-app-counter

  db:
    image: postgres:17
    container_name: web-app-counter-db
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-web-app-counter}
      POSTGRES_USER: ${POSTGRES_USER:-web-app-counter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-web-app-counter} -d ${POSTGRES_DB:-web-app-counter}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - web-app-counter

volumes:
  postgres_data:
  composer_home:

networks:
  web-app-counter:
    driver: bridge
